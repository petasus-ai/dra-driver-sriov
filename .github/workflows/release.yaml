name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

# Serialize pushes per ref so overlapping main builds do not race on the
# :latest tag. Tag builds are never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  GOLANG_VERSION: "1.27"
  IMAGE_NAME: quay.io/edgestack/dra-driver-sriov
  BUILD_PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    name: Build and Push Container Image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # QEMU is only needed for the non-native final stage (yum install);
      # the Go build stage cross-compiles on the native build platform.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Quay
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: quay.io
          username: edgestack
          password: ${{ secrets.QUAY_CI_BOT_SECRET }}

      # Tag scheme: release tags push vX.Y.Z; main pushes latest plus the
      # bare 7-char short SHA. chart-push.yml stamps chart appVersions with
      # `git rev-parse --short=7`, so the short-SHA tag format must not change.
      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: ${{ env.BUILD_PLATFORMS }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          file: ./deployments/container/Dockerfile
          build-args: |
            GOLANG_VERSION=${{ env.GOLANG_VERSION }}
            BASE_IMAGE=quay.io/centos/centos:stream9
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
