name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-and-format:
    name: Generate and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # setup-go caches the module and build caches itself, keyed on go.sum.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run make generate
        run: make generate

      - name: Run make fmt
        run: make fmt

      - name: Check for changes
        run: |
          if ! git diff --quiet; then
            echo "Files have been modified by generate or fmt:"
            git diff --name-only
            git diff
            echo "Please run 'make generate && make fmt' and commit the changes."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        run: make lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run unit tests with coverage
        run: make test-coverage

      # Coveralls was tied to the upstream repository; this fork keeps the
      # coverage profile as a build artifact instead (same as dra-driver-xpu).
      - name: Upload the coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  build-container:
    name: Build Container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only build on pull requests, not on pushes to main
    # (main pushes are handled by release.yaml with multi-arch builds)
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # QEMU is only needed for the non-native final stage (yum install);
      # the Go build stage cross-compiles on the native build platform.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build every platform release.yaml publishes so an arch-specific
      # build break surfaces on the PR instead of after the merge.
      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          file: ./deployments/container/Dockerfile
          build-args: |
            GOLANG_VERSION=1.27
            BASE_IMAGE=quay.io/centos/centos:stream9
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The upstream functional-tests job ran on a self-hosted [sriov] runner
  # with real SR-IOV hardware, which this fork does not have. Hardware
  # coverage is provided by the manually-triggered Virtual E2E workflow.
